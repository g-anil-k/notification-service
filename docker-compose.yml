# Full stack: RabbitMQ + PostgreSQL + API + (scalable) worker.
# Run:  docker compose up --build
# Scale workers:  docker compose up --build --scale worker=3
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"] # UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment: &env
      BROKER: rabbitmq
      STORE: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify
      MAX_ATTEMPTS: 4
      RETRY_BASE_DELAY_MS: 2000
      MOCK_FAILURE_RATE: 0.3 # set to 0 to disable simulated failures
      ROLE: api
    ports: ["3000:3000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }

  worker:
    build: .
    environment:
      <<: *env
      ROLE: worker
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
